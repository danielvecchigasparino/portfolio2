<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <!-- background -->
  <rect x="0" y="0" width="32" height="32" fill="#000000"/>
  <!-- pencil body, vertical, point down, scaled with margin -->
  <g transform="translate(16,16) scale(0.8) translate(-16,-16)">
  <!-- eraser -->
  <rect x="13" y="2" width="6" height="4" rx="1" fill="#f2749b"/>
  <!-- ferrule -->
  <rect x="13" y="6" width="6" height="2.5" fill="#d9d9d9"/>
  <!-- yellow shaft -->
  <rect x="13" y="8.5" width="6" height="15" fill="#ffcc4d"/>
  <!-- shaft shading line -->
  <rect x="13" y="8.5" width="1.5" height="15" fill="#f2b100" opacity="0.6"/>
  <!-- wood taper -->
  <polygon points="13,23.5 19,23.5 16,28" fill="#e6b273"/>
  <!-- graphite tip -->
  <polygon points="14.6,26.6 17.4,26.6 16,29.5" fill="#664500"/>
  <polygon points="15.3,28 16.7,28 16,29.5" fill="#2b2b2b"/>
  </g>
</svg>
